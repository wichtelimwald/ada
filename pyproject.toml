[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-assistant"
version = "0.0.1"
description = "Local-first, privacy-first personal AI assistant"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pydantic-ai-slim[openai]==2.46.0",
    "httpx2==2.13.1",
    "cedarpy==4.12.0",
    "dbos==3.0.0",
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
    "x-wr-timezone==2.0.1",
]

[project.scripts]
ada = "ada.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
ada = ["bootstrap/*.toml"]
