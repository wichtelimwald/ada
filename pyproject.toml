[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-assistant"
version = "0.0.1"
description = "Local-first, privacy-first personal AI assistant"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pydantic-ai-slim[openai]==2.46.0",
    "cedarpy==4.12.0",
    "dbos==3.0.0",
]

[project.scripts]
ada = "ada.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
ada = ["bootstrap/*.toml"]
